[package]
name = "harness-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Tray resident manager for a DeepSeek Harness (dsh) installation"
publish = false

[[bin]]
name = "HarnessManager"
path = "src/main.rs"

[dependencies]
# Tray icon + native context menu (Tauri's standalone crates, no Tauri app framework).
tray-icon = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
